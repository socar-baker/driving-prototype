# 운행화면 프로토타입 GitHub Pages 배포 — ds-site/scripts/pages-deploy.sh 가 이 저장소에 넣는다(여기서 고치면 다음 올리기 때 덮인다).
# site/ 를 올리고, EXPIRES 의 날짜(처음 올린 날 + 30일, 한국 시각)가 되면 expired/(공유 기간 종료 안내)로 바꿔 올린다.
# 매일 00:05(한국 시각)에 날짜를 보고, 만료 전에는 예약 실행에서 다시 올리지 않는다.
# 만료되면 저장소에서도 site/ 를 기록째 지운다 — 공개 저장소(개인 계정은 비공개 저장소로 Pages 를 못 쓴다)라 남겨 두면 만료 뒤에도
# 저장소 파일로 볼 수 있다.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          expires=$(cat EXPIRES)
          if [[ "$today" < "$expires" ]]; then dir=site; else dir=expired; fi
          echo "오늘 $today · 만료일 $expires → $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' || steps.pick.outputs.dir == 'expired'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.pick.outputs.dir }}
      - id: deploy
        if: github.event_name != 'schedule' || steps.pick.outputs.dir == 'expired'
        uses: actions/deploy-pages@v5
      - if: steps.pick.outputs.dir == 'expired' && hashFiles('site/**') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan expired-only
          git rm -r -q --cached site
          rm -rf site
          git commit -q -m '공유 기간 종료 — 사이트 파일을 기록째 지움'
          git push -q -f origin HEAD:main
